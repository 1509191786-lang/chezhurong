<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贷款计算器 — 等额本息 / 等额本金</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: #f5f7fa; color: #1a1a2e; padding: 20px; }
.container { max-width: 1100px; margin: 0 auto; }
h1 { text-align: center; font-size: 24px; margin-bottom: 24px; color: #16213e; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; transition: .2s; }
.form-group input:focus { border-color: #4f6ef7; box-shadow: 0 0 0 3px rgba(79,110,247,.15); }
.btn { padding: 10px 28px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: .2s; }
.btn-primary { background: #4f6ef7; color: #fff; }
.btn-primary:hover { background: #3b5ae0; }
.btn-outline { background: transparent; color: #4f6ef7; border: 1px solid #4f6ef7; margin-left: 8px; }
.btn-outline:hover { background: #f0f3ff; }
.actions { margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.compare-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.compare-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.compare-card h2 { font-size: 17px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #f0f0f0; }
.compare-card h2 .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }
.tag-debx { background: #e8f5e9; color: #2e7d32; }
.tag-debj { background: #e3f2fd; color: #1565c0; }
.stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
.stat-row:last-child { border-bottom: none; }
.stat-row .label { color: #666; }
.stat-row .value { font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-row .value.primary { color: #4f6ef7; }
.table-wrap { overflow-x: auto; margin-top: 12px; max-height: 420px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #f8f9fc; position: sticky; top: 0; z-index: 1; padding: 8px 10px; text-align: right; border-bottom: 1px solid #e0e0e0; color: #555; font-weight: 600; }
th:first-child { text-align: center; }
td { padding: 6px 10px; text-align: right; border-bottom: 1px solid #f0f0f0; font-variant-numeric: tabular-nums; }
td:first-child { text-align: center; color: #999; }
tr:hover td { background: #fafbff; }
tr.total-row td { font-weight: 700; border-top: 2px solid #ddd; background: #f8f9fc; }
.empty-state { text-align: center; padding: 40px 0; color: #aaa; font-size: 14px; }
.tabs { display: flex; gap: 0; margin-bottom: 12px; }
.tab { padding: 8px 18px; border: 1px solid #d1d5db; cursor: pointer; font-size: 13px; background: #fff; color: #666; transition: .2s; }
.tab:first-child { border-radius: 8px 0 0 8px; }
.tab:last-child { border-radius: 0 8px 8px 0; }
.tab.active { background: #4f6ef7; color: #fff; border-color: #4f6ef7; }
.chart-bar-wrap { margin: 12px 0; }
.chart-bar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; }
.chart-bar .principal { background: #4f6ef7; transition: width .4s; }
.chart-bar .interest { background: #ff6b6b; transition: width .4s; }
.chart-legend { display: flex; gap: 16px; justify-content: center; margin-top: 6px; font-size: 12px; color: #666; }
.chart-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.chart-legend .l-principal::before { background: #4f6ef7; }
.chart-legend .l-interest::before { background: #ff6b6b; }
#monthlyChart { margin-top: 16px; }
#monthlyChart svg { width: 100%; height: 200px; }
@media (max-width: 768px) {
  .form-grid { grid-template-columns: 1fr; }
  .compare-cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <h1>贷款计算器</h1>
  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label>贷款金额（元）</label>
        <input type="number" id="amount" value="100000" step="10000" min="0">
      </div>
      <div class="form-group">
        <label>年利率（%）</label>
        <input type="number" id="rateYear" value="4.5" step="0.05" min="0" oninput="syncRate('year')">
      </div>
      <div class="form-group">
        <label>月息（%）</label>
        <input type="number" id="rateMonth" value="0.375" step="0.001" min="0" oninput="syncRate('month')">
      </div>
      <div class="form-group">
        <label>贷款期限（月）</label>
        <input type="number" id="months" value="36" step="1" min="1" max="480">
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="calc()">计算</button>
      <button class="btn btn-outline" onclick="resetExample()">重置示例</button>
    </div>
  </div>

  <div id="result" style="display:none">
    <div class="compare-cards">
      <!-- 等额本息 -->
      <div class="compare-card" id="debxCard">
        <h2>等额本息 <span class="tag tag-debx">每月还款相同</span></h2>
        <div class="stat-row"><span class="label">每月还款</span><span class="value primary" id="debxMonthly"></span></div>
        <div class="stat-row"><span class="label">利息总额</span><span class="value" id="debxTotalInterest"></span></div>
        <div class="stat-row"><span class="label">还款总额</span><span class="value" id="debxTotalPayment"></span></div>
        <div class="chart-bar-wrap">
          <div class="chart-bar"><div class="principal" id="debxBarPrincipal" style="width:50%"></div><div class="interest" id="debxBarInterest" style="width:50%"></div></div>
          <div class="chart-legend"><span class="l-principal">本金</span><span class="l-interest">利息</span></div>
        </div>
        <div class="tabs" id="debxTabs">
          <span class="tab active" onclick="switchDebxTab('table')">明细表</span>
          <span class="tab" onclick="switchDebxTab('chart')">折线图</span>
        </div>
        <div class="table-wrap" id="debxTable"></div>
        <div id="debxChart" style="display:none"></div>
      </div>

      <!-- 等额本金 -->
      <div class="compare-card" id="debjCard">
        <h2>等额本金 <span class="tag tag-debj">每月本金相同</span></h2>
        <div class="stat-row"><span class="label">首月还款</span><span class="value primary" id="debjFirst"></span></div>
        <div class="stat-row"><span class="label">每月递减</span><span class="value" id="debjDecrease"></span></div>
        <div class="stat-row"><span class="label">利息总额</span><span class="value" id="debjTotalInterest"></span></div>
        <div class="stat-row"><span class="label">还款总额</span><span class="value" id="debjTotalPayment"></span></div>
        <div class="chart-bar-wrap">
          <div class="chart-bar"><div class="principal" id="debjBarPrincipal" style="width:50%"></div><div class="interest" id="debjBarInterest" style="width:50%"></div></div>
          <div class="chart-legend"><span class="l-principal">本金</span><span class="l-interest">利息</span></div>
        </div>
        <div class="tabs" id="debjTabs">
          <span class="tab active" onclick="switchDebjTab('table')">明细表</span>
          <span class="tab" onclick="switchDebjTab('chart')">折线图</span>
        </div>
        <div class="table-wrap" id="debjTable"></div>
        <div id="debjChart" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<script>
function calc() {
  const P = parseFloat(document.getElementById('amount').value) || 0;
  const r = (parseFloat(document.getElementById('rateMonth').value) || 0) / 100;
  const n = parseInt(document.getElementById('months').value) || 1;

  // 等额本息
  const debxMonthly = r > 0 ? P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) : P / n;
  const debxRows = [];
  let balance = P;
  let debxTotalInterest = 0;
  for (let i = 1; i <= n; i++) {
    const interest = balance * r;
    const principal = debxMonthly - interest;
    balance -= principal;
    debxTotalInterest += interest;
    debxRows.push({ month: i, principal, interest, total: debxMonthly, balance: balance > 0 ? balance : 0 });
  }
  const debxTotalPayment = P + debxTotalInterest;

  // 等额本金
  const basePrincipal = P / n;
  const debjRows = [];
  let debjBalance = P;
  let debjTotalInterest = 0;
  let debjFirst = 0;
  for (let i = 1; i <= n; i++) {
    const interest = debjBalance * r;
    const total = basePrincipal + interest;
    if (i === 1) debjFirst = total;
    debjBalance -= basePrincipal;
    debjTotalInterest += interest;
    debjRows.push({ month: i, principal: basePrincipal, interest, total, balance: debjBalance > 0 ? debjBalance : 0 });
  }
  const debjTotalPayment = P + debjTotalInterest;
  const monthlyDecrease = r > 0 ? basePrincipal * r : 0;

  // 填充摘要
  document.getElementById('debxMonthly').textContent = '¥' + debxMonthly.toFixed(2);
  document.getElementById('debxTotalInterest').textContent = '¥' + debxTotalInterest.toFixed(2);
  document.getElementById('debxTotalPayment').textContent = '¥' + debxTotalPayment.toFixed(2);
  const debxPct = (P / debxTotalPayment * 100);
  document.getElementById('debxBarPrincipal').style.width = debxPct + '%';
  document.getElementById('debxBarInterest').style.width = (100 - debxPct) + '%';

  document.getElementById('debjFirst').textContent = '¥' + debjFirst.toFixed(2);
  document.getElementById('debjDecrease').textContent = '¥' + monthlyDecrease.toFixed(2);
  document.getElementById('debjTotalInterest').textContent = '¥' + debjTotalInterest.toFixed(2);
  document.getElementById('debjTotalPayment').textContent = '¥' + debjTotalPayment.toFixed(2);
  const debjPct = (P / debjTotalPayment * 100);
  document.getElementById('debjBarPrincipal').style.width = debjPct + '%';
  document.getElementById('debjBarInterest').style.width = (100 - debjPct) + '%';

  // 明细表
  renderTable('debxTable', debxRows);
  renderTable('debjTable', debjRows);

  // 折线图
  renderChart('debxChart', debxRows);
  renderChart('debjChart', debjRows);

  document.getElementById('result').style.display = 'block';

  // 切换 tab 时激活
  document.querySelectorAll('#debxTabs .tab, #debjTabs .tab').forEach(t => t.classList.remove('active'));
  document.querySelector('#debxTabs .tab:first-child').classList.add('active');
  document.querySelector('#debjTabs .tab:first-child').classList.add('active');
}

function renderTable(id, rows) {
  let html = '<table><thead><tr><th>期数</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr><td>' + r.month + '</td><td>' + r.total.toFixed(2) + '</td><td>' + r.principal.toFixed(2) + '</td><td>' + r.interest.toFixed(2) + '</td><td>' + r.balance.toFixed(2) + '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById(id).innerHTML = html;
}

function renderChart(id, rows) {
  const maxTotal = Math.max(...rows.map(r => r.total));
  const w = 800, h = 200;
  const pad = { top: 20, right: 20, bottom: 30, left: 50 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;
  const step = plotW / Math.max(rows.length - 1, 1);

  const principalPoints = rows.map((r, i) => (pad.left + i * step).toFixed(0) + ',' + (pad.top + plotH - (r.principal / maxTotal) * plotH * 0.85).toFixed(1));
  const interestPoints = rows.map((r, i) => {
    const y = pad.top + plotH - ((r.principal + r.interest) / maxTotal) * plotH * 0.85;
    return (pad.left + i * step).toFixed(0) + ',' + y.toFixed(1);
  });
  const totalPoints = rows.map((r, i) => (pad.left + i * step).toFixed(0) + ',' + (pad.top + plotH - (r.total / maxTotal) * plotH * 0.85).toFixed(1));

  // 面积：interest 区域 (顶部)
  const interestArea = interestPoints.slice().reverse().map(p => {
    const [x, y] = p.split(',');
    const bottomY = pad.top + plotH;
    return x + ',' + bottomY;
  });
  // 面积：principal 区域 (底部到底部)
  const principalArea = principalPoints.slice().reverse().map(p => {
    const [x, y] = p.split(',');
    const bottomY = pad.top + plotH;
    return x + ',' + bottomY;
  });

  // Y轴刻度
  let yTicks = '';
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const val = (maxTotal * 1.05 / ticks * (ticks - i));
    const yy = pad.top + (plotH / ticks * i);
    yTicks += '<text x="' + (pad.left - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="#999">' + (val).toFixed(0) + '</text><line x1="' + pad.left + '" y1="' + yy + '" x2="' + (w - pad.right) + '" y2="' + yy + '" stroke="#eee" stroke-width="1"/>';
  }

  const svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">' + yTicks + '<polygon points="' + interestArea.join(' ') + '" fill="rgba(255,107,107,0.15)" /><polygon points="' + principalArea.join(' ') + '" fill="rgba(79,110,247,0.15)" /><polyline points="' + totalPoints.join(' ') + '" fill="none" stroke="#4f6ef7" stroke-width="2" /><polyline points="' + interestPoints.join(' ') + '" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3" /><polyline points="' + principalPoints.join(' ') + '" fill="none" stroke="#4f6ef7" stroke-width="1.5" stroke-dasharray="4,3" /><text x="' + (w - pad.right) + '" y="' + (pad.top - 6) + '" text-anchor="end" font-size="11" fill="#4f6ef7">月供</text><text x="' + (w - pad.right) + '" y="' + (pad.top + 8) + '" text-anchor="end" font-size="11" fill="#ff6b6b">利息</text></svg>';
  document.getElementById(id).innerHTML = svg;
}

function switchDebxTab(tab) {
  const t = document.getElementById('debxTabs').querySelectorAll('.tab');
  t[0].classList.toggle('active', tab === 'table');
  t[1].classList.toggle('active', tab === 'chart');
  document.getElementById('debxTable').style.display = tab === 'table' ? '' : 'none';
  document.getElementById('debxChart').style.display = tab === 'chart' ? '' : 'none';
}

function switchDebjTab(tab) {
  const t = document.getElementById('debjTabs').querySelectorAll('.tab');
  t[0].classList.toggle('active', tab === 'table');
  t[1].classList.toggle('active', tab === 'chart');
  document.getElementById('debjTable').style.display = tab === 'table' ? '' : 'none';
  document.getElementById('debjChart').style.display = tab === 'chart' ? '' : 'none';
}

function resetExample() {
  document.getElementById('amount').value = 100000;
  document.getElementById('rateYear').value = 4.5;
  document.getElementById('rateMonth').value = 0.375;
  document.getElementById('months').value = 36;
  calc();
}

function syncRate(from) {
  if (from === 'year') {
    const y = parseFloat(document.getElementById('rateYear').value) || 0;
    document.getElementById('rateMonth').value = (y / 12).toFixed(3);
  } else {
    const m = parseFloat(document.getElementById('rateMonth').value) || 0;
    document.getElementById('rateYear').value = (m * 12).toFixed(2);
  }
}

calc();
</script>
</body>
</html>
